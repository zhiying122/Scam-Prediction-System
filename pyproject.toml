[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-scam-evolution-prediction"
version = "0.1.0"
description = "AI 詐騙進化預測系統 - 主動式防詐情報平台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web 框架
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # 資料驗證與設定管理
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # 資料庫
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    # Redis
    "redis[hiredis]>=5.0.4",
    # Qdrant
    "qdrant-client>=1.9.0",
    # LLM 整合
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "openai>=1.30.0",
    # NLP 與語意嵌入
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "langdetect>=1.0.9",
    "lingua-language-detector>=2.0.0",
    # 時間序列分析與異常偵測
    "statsmodels>=0.14.2",
    "prophet>=1.1.5",
    "pyod>=2.0.0",
    # 排程
    "apscheduler>=3.10.4",
    # 存取管制
    "pyotp>=2.9.0",
    # 視覺化儀表板
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    # 資料處理
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # HTTP 客戶端
    "httpx>=0.27.0",
    # 工具套件
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.103.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── pytest 設定 ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]
markers = [
    "unit: 單元測試",
    "integration: 整合測試",
    "property: 屬性測試（hypothesis）",
    "slow: 執行時間較長的測試",
]

# ── Hypothesis 屬性測試設定 ───────────────────────────────────────────────────
[tool.hypothesis]
max_examples = 20
deriving = "auto"

# ── Ruff 程式碼風格設定 ───────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

# ── mypy 型別檢查設定 ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
